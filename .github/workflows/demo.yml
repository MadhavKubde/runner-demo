name: Runner Demo

on:
  push:

jobs:
  hello:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Show hostname
        run: hostname

      - name: Show current user
        run: whoami

      - name: Print working directory
        run: pwd

      - name: List files
        run: ls -la

      - name: Print message
        run: echo "Hello from Self Hosted Runner!"
